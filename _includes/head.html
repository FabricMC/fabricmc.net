<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ metadata.title | escape }}</title>
  <meta name="description" content="{{ metadata.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ title | default: site.title | escape }}">
  <meta property="og:description" content="{{ metadata.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:locale" content="en_US">
  <meta property="og:type" content="{% if layout == 'post' %}article{% else %}website{% endif %}">
  <meta name="twitter:card" content="summary">
  <meta property="twitter:title" content="{{ title | default: site.title | escape }}">
  <script type="application/ld+json">{{ metadata.schema | json }}</script>
  {% if layout == 'post' %}<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">{% endif %}
  <link rel="stylesheet" href="{{ "/assets/main.css" | asset_url }}">
  <link rel="stylesheet" media="(prefers-color-scheme: dark)" href="{{ "/assets/dark.css" | asset_url }}">
  <link type="application/atom+xml" rel="alternate" href="{{ '/feed.xml' | absolute_url }}" title="{{ site.title }}">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png">
</head>
