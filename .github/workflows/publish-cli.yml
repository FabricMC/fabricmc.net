name: Publish CLI

on:
  workflow_run:
    workflows: [Build]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-cli-npm
  queue: max

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.4'
      - run: npm install -g npm@11
      - name: Set CLI version
        working-directory: cli
        env:
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: npm version "0.1.${BUILD_NUMBER}" --no-git-tag-version
      - run: npm --prefix scripts ci
      - run: npm --prefix cli run build
      - name: Check CLI
        working-directory: cli
        run: |
          ./bundled.mjs --version
          ./bundled.mjs --help
          npm pack --dry-run
      - name: Publish to npm
        working-directory: cli
        run: npm publish --access public
