name: Publish CLI

on:
  workflow_run:
    workflows: [Build]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-cli-npm
  queue: max

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
      - name: Set CLI version
        working-directory: cli
        env:
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: npm version "0.1.${BUILD_NUMBER}" --no-git-tag-version
      - run: npm run build --workspace cli
      - name: Check CLI
        working-directory: cli
        run: |
          ./bundled.mjs --version
          ./bundled.mjs --help
          npm pack --dry-run
      - name: Publish to npm
        working-directory: cli
        run: npm publish --access public
