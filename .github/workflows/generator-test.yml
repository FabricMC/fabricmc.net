name: Generator Test
on:
  - workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          java: 'true'
      - run: npm test --workspace cli
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: generator-tests
          path: |
            cli/tests/*_yarn_*/**
            cli/tests/*_mojmap_*/**
