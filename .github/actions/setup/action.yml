name: Setup CI
description: Configure Node.js, npm, dependency caching, and optional Java support.
inputs:
  install-dependencies:
    description: Install the repository's npm dependencies.
    default: 'true'
  java:
    description: Install Java for generated-project tests.
    default: 'false'
  registry-url:
    description: npm registry used when publishing the CLI.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
        registry-url: ${{ inputs.registry-url }}
        cache: ${{ inputs.install-dependencies == 'true' && 'npm' || '' }}
        package-manager-cache: false
    - name: Setup npm
      shell: bash
      run: npm install --global npm@12.2.0
    - uses: actions/setup-java@v6.0.1
      if: inputs.java == 'true'
      with:
        distribution: temurin
        java-version: '25'
        check-latest: true
        cache: gradle
    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: npm ci
